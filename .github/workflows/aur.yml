# Publish the AUR package when a GitHub release is published, once the tag's
# own run of the site workflow (tests + release checks) has passed. Run by
# hand, it's a dry run unless "publish" is ticked: it updates and builds the
# package and uploads it as an artifact, but pushes nothing.
#
# Pushing to the AUR needs the secret AUR_SSH_PRIVATE_KEY (see
# packaging/aur/README.md); without it, that step is skipped with a warning.

name: aur

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package, e.g. v0.2.0 (default: the latest release)"
        required: false
      publish:
        description: "Push to the AUR and commit packaging/aur back to main"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      publish: ${{ steps.tag.outputs.publish }}
      aur_key: ${{ steps.tag.outputs.aur_key }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Which tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          # Only whether it's set: job names can't read secrets.
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            tag=$RELEASE_TAG publish=true
            if [[ $PRERELEASE == true ]]; then
              echo "::notice::$tag is a pre-release: building it, not publishing"; publish=false
            fi
          else
            tag=${INPUT_TAG:-$(gh api "repos/$REPO/releases/latest" --jq .tag_name)}
            publish=${INPUT_PUBLISH:-false}
          fi
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1; }
          echo "$tag, publish=$publish"
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "publish=$publish"; echo "aur_key=$AUR_KEY"; } >> "$GITHUB_OUTPUT"

      - name: Wait for the tag's tests and release checks
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          # The tag push starts the site workflow; a release published with a
          # new tag starts both at once. Give the run 5 minutes to appear and
          # 40 to finish.
          for ((i = 0; i < 135; i++)); do
            run=$(gh api "repos/$REPO/actions/workflows/site.yml/runs?event=push&head_sha=$sha" \
                    --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\")][0] // empty
                          | \"\(.status) \(.conclusion) \(.html_url)\"")
            read -r status conclusion link <<<"$run"
            if [[ -z $run ]]; then
              (( i < 15 )) || { echo "::error::no site workflow run for the $TAG push"; exit 1; }
            elif [[ $status == completed ]]; then
              [[ $conclusion == success ]] && { echo "passed: $link"; exit 0; }
              echo "::error::the $TAG run did not pass ($conclusion): $link"; exit 1
            fi
            sleep 20
          done
          echo "::error::timed out waiting for the $TAG run: $link"; exit 1

  aur:
    # Says in the run list what this run does with the AUR.
    name: >-
      ${{ needs.gate.outputs.publish != 'true' && 'Build and check (dry run)'
          || needs.gate.outputs.aur_key == 'true' && 'Build, check and publish to the AUR'
          || 'Build and check (AUR push off: no key)' }}
    needs: gate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    env:
      V: ${{ needs.gate.outputs.version }}
      PUBLISH: ${{ needs.gate.outputs.publish }}
      PKG: /home/builder/pkg
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh namcap pandoc-cli entr python make github-cli

      # main, not the tag: packaging/aur is committed back to it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update the PKGBUILD for v${{ env.V }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          cp -r packaging/aur "$PKG"
          chown -R builder: "$PKG"
          sudo -u builder "$PKG/update.sh" "$V" "$PKG"
          git diff --no-index packaging/aur/PKGBUILD "$PKG/PKGBUILD" || true

      - name: Build and check (makepkg, namcap)
        working-directory: ${{ env.PKG }}
        run: |
          sudo -u builder makepkg -f --noconfirm
          namcap PKGBUILD md-preview-*.pkg.tar.*

      - uses: actions/upload-artifact@v7
        with:
          name: aur-md-preview-${{ env.V }}
          include-hidden-files: true
          path: |
            ${{ env.PKG }}/PKGBUILD
            ${{ env.PKG }}/.SRCINFO
            ${{ env.PKG }}/md-preview-*.pkg.tar.*

      # PKGBUILD for `makepkg -si` (a stable link: releases/latest/download/
      # PKGBUILD), and the checked package for `pacman -U`. Before the AUR
      # push, so a release has them even while that's off. --clobber: re-runs.
      - name: Attach the PKGBUILD and package to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$V" "$PKG/PKGBUILD" "$PKG"/md-preview-*.pkg.tar.* \
            --clobber --repo "$GITHUB_REPOSITORY"

          # Assets have no description field, so say what they are in the
          # release notes, once (the marker keeps re-runs from repeating it).
          marker='<!-- md-preview: arch assets -->'
          notes=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [[ $notes != *"$marker"* ]]; then
            pkg=$(basename "$PKG"/md-preview-*.pkg.tar.*)
            {
              printf '%s\n\n' "$notes" "$marker"
              # shellcheck disable=SC2016  # the backticks are Markdown
              printf '%s\n' \
                '### Arch Linux' '' \
                '- **`PKGBUILD`**: build and install from source, as an AUR helper would:' \
                '  `makepkg -si` in a folder containing it.' \
                "- **\`$pkg\`**: the package CI built and checked from that PKGBUILD:" \
                "  \`sudo pacman -U $pkg\`." '' \
                'Details: [INSTALL.md](https://github.com/bvraghav/md-preview/blob/main/INSTALL.md#arch-linux).'
            } > "$RUNNER_TEMP/notes.md"
            gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Push to the AUR
        if: env.PUBLISH == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # The Ed25519 host key fingerprint published on aur.archlinux.org.
          AUR_HOST_KEY: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
        run: |
          # No key yet (no AUR account): the package was still built and
          # checked above; publishing starts once the secret is added.
          if [[ -z $AUR_SSH_PRIVATE_KEY ]]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set: not pushing $V to the AUR"
            echo "Not pushed to the AUR: the secret \`AUR_SSH_PRIVATE_KEY\` is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          [[ $fp == "$AUR_HOST_KEY" ]] || { echo "::error::unexpected AUR host key: $fp"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/md-preview.git "$RUNNER_TEMP/aur"
          cp "$PKG/PKGBUILD" "$PKG/.SRCINFO" "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          # Commit as the PKGBUILD's maintainer.
          who=$(sed -n 's/^# Maintainer: //p' PKGBUILD)
          git config user.name "${who% <*}"
          email=${who#*<}
          git config user.email "${email%%>*}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "the AUR already has $V"; exit 0; fi
          git commit -m "md-preview $V"
          git push origin HEAD:master

      # Pushes made with GITHUB_TOKEN start no workflows, so this commit
      # can't set off another run; [skip ci] says so in the history too.
      - name: Commit packaging/aur back to main
        if: env.PUBLISH == 'true'
        run: |
          main=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          if [[ $main != "$V" ]]; then
            echo "::notice::main's PKGBUILD is for $main, not $V; leaving it alone"; exit 0
          fi
          cp "$PKG/PKGBUILD" "$PKG/.SRCINFO" packaging/aur/
          git add packaging/aur
          if git diff --cached --quiet; then echo "main is up to date"; exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "packaging/aur: md-preview $V checksums [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
