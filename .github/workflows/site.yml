# Build the project website with md-preview itself, run the regression
# tests (tests/), and publish the site to GitHub Pages. Pull requests build
# and test only; pushes to main also deploy. Pushing a vX.Y.Z tag runs the
# same tests on the tagged commit, plus the release checks with TAG set, so
# a bad tag shows up red; tags don't deploy.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: site

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: "3.10.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y entr
          sudo npm install -g browser-sync
          google-chrome --version

      - name: Cache KaTeX and mermaid
        uses: actions/cache@v6
        with:
          path: ~/.local/share/md-preview/vendor
          key: md-preview-vendor-${{ hashFiles('bin/md-preview') }}

      - name: Build site
        run: make -C site

      - name: Regression tests
        run: |
          tag=''
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tag=$GITHUB_REF_NAME; fi
          make -k -C tests ci TAG="$tag" MD_PREVIEW_DATA="$HOME/.local/share/md-preview" CHROME=google-chrome

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
